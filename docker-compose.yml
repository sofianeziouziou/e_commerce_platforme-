services:
  postgres:
    image: postgres:16-alpine
    container_name: freshmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshmarket}
      POSTGRES_USER: ${POSTGRES_USER:-freshmarket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sofiane03}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshmarket_user} -d ${POSTGRES_DB:-freshmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["apps"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshmarket-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freshmarket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freshmarket_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Sofiane03}
      JWT_SECRET: ${JWT_SECRET:-freshmarket-local-development-secret-key-change-before-production}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend_web:
    profiles: ["apps"]
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: freshmarket-frontend-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_WEB_PORT:-5173}:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: freshmarket-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@freshmarket.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
