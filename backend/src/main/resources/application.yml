server:
  port: ${BACKEND_PORT:8089}

spring:
  application:
    name: freshmarket-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freshmarket}
    username: ${SPRING_DATASOURCE_USERNAME:freshmarket_user}
    password: ${SPRING_DATASOURCE_PASSWORD:Sofiane03}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET:freshmarket-local-development-secret-key-change-before-production}
